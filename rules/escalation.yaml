# Escalation rule pack.
#
# Rules are hyperedges over a capability set, not graph edges: most methods require an
# AND of several actions plus preconditions that a plain traversal cannot express.
#
# Reachability is a fixpoint. Start with the capabilities granted to taint-reachable
# roles, apply every rule whose preconditions hold, add what it grants, repeat until the
# set stops changing.
#
# The rule pack *format* is the artifact. The count is not — a cited, precondition-aware
# rule beats ten actions-only ones.
#
# Fields:
#   id               stable identifier, referenced in reports and provenance paths
#   requires_actions all must be present in the current capability set
#   requires_facts   preconditions resolved from outside identity policies (trust
#                    policies, service configuration)
#   grants           what enters the capability set when the rule fires
#   source           citation; every rule names where the method came from
#   notes            why the preconditions are what they are

version: 1

rules:
  - id: passrole-lambda-createfunction
    title: PassRole into a new Lambda function
    requires_actions: [iam:PassRole, lambda:CreateFunction, lambda:InvokeFunction]
    requires_facts: [role_trusts_service:lambda.amazonaws.com]
    grants: effective_principal:{passable_role}
    source: rhino-2018
    notes: >
      The trust-policy precondition is load-bearing. PassRole in an identity policy is
      not sufficient — the target role must admit lambda.amazonaws.com, or the call
      fails. Resolving this from identity policies alone produces an unsound finding.

# Remaining Rhino methods are added as the resolver lands (project plan §W5).
# Each one arrives with its preconditions and its citation, or it does not arrive.
